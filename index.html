<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gastos Voz</title><style>body{    margin:0;    font-family: Arial, sans-serif;    background:#0f0f0f;    color:white;}.container{    max-width:500px;    margin:auto;    padding:20px;}h1{    text-align:center;    margin-bottom:20px;}.btn{    width:100%;    padding:15px;    margin:10px 0;    border:none;    border-radius:10px;    font-size:16px;    color:white;    cursor:pointer;}.btn-voice{background:#16a34a;}.btn-manual{background:#2563eb;}.card{    background:#1f1f1f;    padding:12px;    border-radius:10px;    margin-bottom:10px;}.total{    font-size:20px;    margin:15px 0;}</style></head><body><div class="container"><h1>💰 Gastos Voz</h1><button class="btn btn-voice" onclick="startVoice()">🎤 Hablar</button><button class="btn btn-manual" onclick="addManual()">✍️ Agregar Manual</button><div class="total" id="total">Total: $0</div><div id="list"></div></div><!-- Firebase SDK --><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";const firebaseConfig = {  apiKey: "AIzaSyBzZI_A7X9OT5Eesh1cuh6SyQvqa5ln-HM",  authDomain: "gastos-voz.firebaseapp.com",  databaseURL: "https://gastos-voz-default-rtdb.firebaseio.com",  projectId: "gastos-voz",  storageBucket: "gastos-voz.firebasestorage.app",  messagingSenderId: "117528060453",  appId: "1:117528060453:web:2e4606b4a7e9ad695a55cc"};const app = initializeApp(firebaseConfig);const db = getDatabase(app);const list = document.getElementById("list");const totalEl = document.getElementById("total");function render(data){    list.innerHTML="";    let total=0;    Object.values(data || {}).forEach(item=>{        total += item.amount;        const div = document.createElement("div");        div.className="card";        div.innerHTML = `            <b>${item.text}</b><br>            $${item.amount}        `;        list.appendChild(div);    });    totalEl.innerText = "Total: $" + total;}onValue(ref(db, "gastos"), snapshot=>{    render(snapshot.val());});window.addManual = function(){    const text = prompt("¿Qué gastaste?");    const amount = parseInt(prompt("Monto"));    if(!text || !amount) return;    push(ref(db, "gastos"), {        text,        amount,        date: Date.now()    });}window.startVoice = function(){    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;    if(!SpeechRecognition){        alert("Tu navegador no soporta voz 😢");        return;    }    const recognition = new SpeechRecognition();    recognition.lang = "es-ES";    recognition.start();    recognition.onresult = function(event){        const text = event.results[0][0].transcript.toLowerCase();        let amountMatch = text.match(/\d+/);        let amount = amountMatch ? parseInt(amountMatch[0]) : 0;        if(amount === 0){            amount = parseInt(prompt("No detecté monto, ingrésalo"));        }        push(ref(db, "gastos"), {            text,            amount,            date: Date.now()        });    }}</script></body></html>
