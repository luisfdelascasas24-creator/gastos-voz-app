<!DOCTYPE html><html lang="es"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Gastos Voz</title>  <meta name="theme-color" content="#ff7a00" />  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>  <style>    * { box-sizing: border-box; }    body {      margin: 0;      font-family: "Segoe UI", Arial, sans-serif;      background: radial-gradient(circle at top, #1b1230 0%, #0a0a14 35%, #07070d 100%);      color: white;      min-height: 100vh;    }    .app {      max-width: 460px;      margin: 0 auto;      padding: 18px 14px 40px;    }    .header {      text-align: center;      margin-bottom: 18px;    }    .header h1 {      margin: 0;      font-size: 2rem;      font-weight: 900;      letter-spacing: -0.04em;    }    .header p {      margin: 8px 0 0;      color: #a1a1b8;      font-size: 0.95rem;    }    .summary-grid {      display: grid;      grid-template-columns: repeat(3, 1fr);      gap: 10px;      margin-bottom: 16px;    }    .summary-card {      border-radius: 18px;      padding: 14px 12px;      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));      border: 1px solid rgba(255,255,255,0.07);      box-shadow: 0 10px 28px rgba(0,0,0,0.25);    }    .summary-card .label {      font-size: 0.72rem;      text-transform: uppercase;      letter-spacing: 0.08em;      color: #cfd0e2;      font-weight: 800;    }    .summary-card .value {      margin-top: 8px;      font-size: 1.1rem;      font-weight: 900;      line-height: 1.1;    }    .summary-card.today .value { color: #ffb156; }    .summary-card.week .value { color: #6ea8ff; }    .summary-card.month .value { color: #c08dff; }    .panel {      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025));      border: 1px solid rgba(255,255,255,0.07);      border-radius: 22px;      padding: 16px;      box-shadow: 0 16px 36px rgba(0,0,0,0.28);      margin-bottom: 14px;    }    .section-title {      margin: 0 0 12px;      font-size: 0.85rem;      text-transform: uppercase;      letter-spacing: 0.08em;      color: #d6d7e8;      font-weight: 900;    }    .mic-box {      text-align: center;      padding: 8px 0 4px;    }    .mic-button {      width: 120px;      height: 120px;      border-radius: 50%;      border: none;      background: linear-gradient(135deg, #ff7a00, #ff4800);      color: white;      font-size: 2.6rem;      cursor: pointer;      box-shadow:        0 0 0 10px rgba(255,122,0,0.08),        0 18px 38px rgba(255,122,0,0.30);      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.2s ease;    }    .mic-button:hover {      filter: brightness(1.05);      box-shadow:        0 0 0 14px rgba(255,122,0,0.08),        0 18px 38px rgba(255,122,0,0.34);    }    .mic-button:active {      transform: scale(0.97);    }    .status-text {      margin-top: 14px;      color: #d0d2e5;      font-size: 0.95rem;      min-height: 22px;    }    .hint {      margin-top: 8px;      color: #9fa3ba;      font-size: 0.85rem;      line-height: 1.4;    }    .field {      margin-bottom: 12px;    }    .field label {      display: block;      margin-bottom: 6px;      color: #a9acc3;      font-size: 0.82rem;      font-weight: 700;    }    .field input,    .field select {      width: 100%;      padding: 14px;      border-radius: 14px;      border: 1px solid #2d3047;      background: #121422;      color: white;      font-size: 0.98rem;      outline: none;    }    .field input:focus,    .field select:focus {      border-color: #ff7a00;      box-shadow: 0 0 0 3px rgba(255,122,0,0.12);    }    .row {      display: grid;      grid-template-columns: 1fr 1fr;      gap: 10px;    }    .type-switch {      display: flex;      gap: 8px;      margin-bottom: 12px;    }    .switch-btn {      flex: 1;      padding: 12px;      border-radius: 14px;      border: 1px solid #313552;      background: #131624;      color: #d9dbea;      font-weight: 800;      cursor: pointer;      transition: 0.15s ease;    }    .switch-btn.active {      background: linear-gradient(135deg, #2a1707, #3b1f08);      border-color: rgba(255,122,0,0.4);      color: #ffd3a0;    }    .main-btn {      width: 100%;      padding: 15px;      border: none;      border-radius: 14px;      font-size: 1rem;      font-weight: 900;      cursor: pointer;      transition: 0.15s ease;      margin-top: 4px;    }    .main-btn:active {      transform: scale(0.985);    }    .btn-green {      background: linear-gradient(135deg, #00c853, #22e37a);      color: white;      box-shadow: 0 10px 24px rgba(0,200,83,0.26);    }    .filters {      display: flex;      gap: 8px;      margin-bottom: 12px;      flex-wrap: wrap;    }    .filter-btn {      padding: 10px 14px;      border-radius: 999px;      border: 1px solid #2e3149;      background: #121422;      color: #d9dbea;      font-weight: 800;      font-size: 0.85rem;      cursor: pointer;    }    .filter-btn.active {      background: #2a1707;      border-color: rgba(255,122,0,0.4);      color: #ffd3a0;    }    .list {      display: flex;      flex-direction: column;      gap: 10px;    }    .card {      background: #111320;      border: 1px solid #262a42;      border-left: 5px solid #ff7a00;      border-radius: 16px;      padding: 14px;      display: flex;      justify-content: space-between;      align-items: center;      gap: 12px;      animation: fadeIn 0.22s ease;    }    .card.ingreso { border-left-color: #16c35b; }    .card.gasto { border-left-color: #ff6d4a; }    .card-left {      min-width: 0;    }    .card-title {      font-size: 0.96rem;      font-weight: 900;      line-height: 1.25;      word-break: break-word;    }    .card-meta {      margin-top: 6px;      color: #9ea3bb;      font-size: 0.78rem;      display: flex;      gap: 8px;      flex-wrap: wrap;    }    .amount {      font-size: 1rem;      font-weight: 900;      white-space: nowrap;    }    .amount.ingreso { color: #47e083; }    .amount.gasto { color: #ffb156; }    .empty {      text-align: center;      color: #727791;      padding: 22px 10px;      font-size: 0.95rem;    }    .error-box {      margin-top: 10px;      padding: 12px;      border-radius: 14px;      background: rgba(239,68,68,.12);      border: 1px solid rgba(239,68,68,.25);      color: #ffb4b4;      font-size: 0.9rem;      line-height: 1.4;    }    .toast {      position: fixed;      left: 50%;      bottom: 18px;      transform: translateX(-50%);      background: #101218;      color: white;      border: 1px solid #303548;      border-radius: 14px;      padding: 12px 14px;      z-index: 9999;      box-shadow: 0 12px 30px rgba(0,0,0,0.35);      min-width: 220px;      text-align: center;    }    @keyframes fadeIn {      from { opacity: 0; transform: translateY(8px); }      to { opacity: 1; transform: translateY(0); }    }    @media (max-width: 430px) {      .summary-grid { grid-template-columns: 1fr; }      .row { grid-template-columns: 1fr; }    }  </style>  <script>    const firebaseConfig = {      apiKey: "AIzaSyBzZI_A7X9OT5Eesh1cuh6SyQvqa5ln-HM",      authDomain: "gastos-voz.firebaseapp.com",      databaseURL: "https://gastos-voz-default-rtdb.firebaseio.com",      projectId: "gastos-voz",      storageBucket: "gastos-voz.firebasestorage.app",      messagingSenderId: "117528060453",      appId: "1:117528060453:web:2e4606b4a7e9ad695a55cc"    };    firebase.initializeApp(firebaseConfig);  </script></head><body>  <div id="app"></div>  <script>    const db = firebase.database();    let toastTimeout = null;    const categories = {      gasto: ["comida","transporte","arriendo","servicios","compras","salud","bebé","otros"],      ingreso: ["sueldo","ventas","devolución","préstamo","otros"]    };    let state = {      records: [],      filter: "todos",      type: "gasto",      listening: false,      speechText: "",      dbError: ""    };    function todayInputValue() {      const d = new Date();      const yyyy = d.getFullYear();      const mm = String(d.getMonth() + 1).padStart(2, "0");      const dd = String(d.getDate()).padStart(2, "0");      return `${yyyy}-${mm}-${dd}`;    }    function formatCLP(value) {      return new Intl.NumberFormat("es-CL", {        style: "currency",        currency: "CLP",        maximumFractionDigits: 0      }).format(Number(value) || 0);    }    function showToast(msg) {      const old = document.getElementById("appToast");      if (old) old.remove();      const el = document.createElement("div");      el.id = "appToast";      el.className = "toast";      el.textContent = msg;      document.body.appendChild(el);      clearTimeout(toastTimeout);      toastTimeout = setTimeout(() => {        const t = document.getElementById("appToast");        if (t) t.remove();      }, 2500);    }    function normalizeText(text) {      return String(text || "")        .toLowerCase()        .normalize("NFD")        .replace(/[\u0300-\u036f]/g, "")        .trim();    }    function parseMoney(text) {      const t = normalizeText(text);      const match = t.match(/\d+[\d.]*/);      if (!match) return 0;      let num = parseInt(match[0].replace(/\./g, ""), 10);      if (Number.isNaN(num)) return 0;      if (/luca|lucas|mil/.test(t) && num < 1000) {        num = num * 1000;      }      return num;    }    function inferType(text) {      const t = normalizeText(text);      if (/ingreso|ingresaron|me pagaron|recibi|recibí|sueldo|vendi|vendí|gane|gané/.test(t)) {        return "ingreso";      }      return "gasto";    }    function inferCategory(text, type) {      const t = normalizeText(text);      const rules = {        comida: ["comida","almuerzo","desayuno","cena","pizza","pan"],        transporte: ["uber","taxi","micro","bus","metro","bencina"],        arriendo: ["arriendo","alquiler"],        servicios: ["luz","agua","internet","telefono","teléfono","gas"],        compras: ["compra","compras","super","supermercado","ropa"],        salud: ["farmacia","salud","medicina","doctor","clinica"],        bebé: ["bebe","bebé","pañal","panal","leche"],        sueldo: ["sueldo","salario"],        ventas: ["venta","ventas","vendi","vendí"],        devolución: ["devolucion","devolución","reembolso"],        préstamo: ["prestamo","préstamo"]      };      const list = categories[type];      for (const cat of list) {        const keys = rules[cat] || [];        if (keys.some(k => t.includes(normalizeText(k)))) return cat;      }      return "otros";    }    function inferDate(text) {      const t = normalizeText(text);      const base = new Date();      if (t.includes("ayer")) base.setDate(base.getDate() - 1);      else if (t.includes("anteayer")) base.setDate(base.getDate() - 2);      const yyyy = base.getFullYear();      const mm = String(base.getMonth() + 1).padStart(2, "0");      const dd = String(base.getDate()).padStart(2, "0");      return `${yyyy}-${mm}-${dd}`;    }    function saveData(data) {      return db.ref("gasto_voz_registros").push(data);    }    async function saveManual() {      const desc = document.getElementById("desc").value.trim();      const monto = Number(document.getElementById("monto").value || 0);      const tipo = document.getElementById("tipo").value;      const categoria = document.getElementById("categoria").value;      const metodo = document.getElementById("metodo").value;      const fecha = document.getElementById("fecha").value || todayInputValue();      if (!desc) {        showToast("Falta la descripción");        return;      }      if (!monto) {        showToast("Falta el monto");        return;      }      try {        await saveData({          desc,          monto,          tipo,          categoria,          metodo,          fecha,          createdAt: Date.now()        });        document.getElementById("desc").value = "";        document.getElementById("monto").value = "";        document.getElementById("fecha").value = todayInputValue();        showToast("Movimiento guardado");      } catch (err) {        console.error(err);        showToast("No se pudo guardar en Firebase");        state.dbError = "La app no pudo escribir en Firebase. Revisa las reglas de Realtime Database.";        render();      }    }    function startVoice() {      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;      if (!SpeechRecognition) {        showToast("Tu navegador no soporta voz");        return;      }      const recognition = new SpeechRecognition();      recognition.lang = "es-CL";      recognition.interimResults = false;      recognition.maxAlternatives = 1;      state.listening = true;      state.speechText = "";      render();      recognition.onresult = async function(event) {        const text = event.results[0][0].transcript;        state.speechText = text;        const monto = parseMoney(text);        const tipo = inferType(text);        const categoria = inferCategory(text, tipo);        const fecha = inferDate(text);        state.listening = false;        render();        if (!monto) {          showToast("No entendí el monto");          return;        }        const ok = confirm(          `Entendí esto:\n\n` +          `Descripción: ${text}\n` +          `Monto: ${formatCLP(monto)}\n` +          `Tipo: ${tipo}\n` +          `Categoría: ${categoria}\n` +          `Fecha: ${fecha}\n\n` +          `¿Guardar?`        );        if (!ok) return;        try {          await saveData({            desc: text,            monto,            tipo,            categoria,            metodo: "efectivo",            fecha,            createdAt: Date.now()          });          showToast("Movimiento guardado");        } catch (err) {          console.error(err);          showToast("No se pudo guardar en Firebase");          state.dbError = "La app no pudo escribir en Firebase. Revisa las reglas de Realtime Database.";          render();        }      };      recognition.onerror = function() {        state.listening = false;        render();        showToast("No pude escuchar bien");      };      recognition.onend = function() {        state.listening = false;        render();      };      recognition.start();    }    function getSummary() {      const today = todayInputValue();      const now = new Date();      const weekStart = new Date(now);      weekStart.setDate(now.getDate() - 6);      weekStart.setHours(0, 0, 0, 0);      const monthKey = today.slice(0, 7);      let todayTotal = 0;      let weekTotal = 0;      let monthTotal = 0;      state.records.forEach(r => {        const signed = r.tipo === "ingreso" ? Number(r.monto || 0) : -Number(r.monto || 0);        if (r.fecha === today) todayTotal += signed;        if (new Date(r.fecha + "T00:00:00") >= weekStart) weekTotal += signed;        if ((r.fecha || "").slice(0, 7) === monthKey) monthTotal += signed;      });      return { todayTotal, weekTotal, monthTotal };    }    function getFilteredRecords() {      if (state.filter === "todos") return state.records;      return state.records.filter(r => r.tipo === state.filter);    }    function render() {      const summary = getSummary();      const list = getFilteredRecords();      document.getElementById("app").innerHTML = `        <div class="app">          <div class="header">            <h1>💰 Gastos Voz</h1>            <p>Registra gastos e ingresos hablando o escribiendo</p>          </div>          <div class="summary-grid">            <div class="summary-card today">              <div class="label">Hoy</div>              <div class="value">${formatCLP(summary.todayTotal)}</div>            </div>            <div class="summary-card week">              <div class="label">Semana</div>              <div class="value">${formatCLP(summary.weekTotal)}</div>            </div>            <div class="summary-card month">              <div class="label">Mes</div>              <div class="value">${formatCLP(summary.monthTotal)}</div>            </div>          </div>          <div class="panel">            <div class="section-title">Registro por voz</div>            <div class="mic-box">              <button class="mic-button" onclick="startVoice()">🎤</button>              <div class="status-text">                ${state.listening ? "Escuchando..." : (state.speechText ? `Escuché: ${state.speechText}` : "Toca el micrófono para hablar")}              </div>              <div class="hint">                Ejemplo: “gasté 12 lucas en almuerzo” o “ayer me ingresaron 300 mil por sueldo”              </div>            </div>          </div>          <div class="panel">            <div class="section-title">Registro manual</div>            <div class="type-switch">              <button class="switch-btn ${state.type === "gasto" ? "active" : ""}" onclick="setType('gasto')">💸 Gasto</button>              <button class="switch-btn ${state.type === "ingreso" ? "active" : ""}" onclick="setType('ingreso')">✨ Ingreso</button>            </div>            <div class="field">              <label>Descripción</label>              <input id="desc" placeholder="Ej: almuerzo, uber, sueldo" />            </div>            <div class="row">              <div class="field">                <label>Monto</label>                <input id="monto" type="number" placeholder="Ej: 12000" />              </div>              <div class="field">                <label>Fecha</label>                <input id="fecha" type="date" value="${todayInputValue()}" />              </div>            </div>            <div class="row">              <div class="field">                <label>Tipo</label>                <select id="tipo">                  <option value="gasto" ${state.type === "gasto" ? "selected" : ""}>Gasto</option>                  <option value="ingreso" ${state.type === "ingreso" ? "selected" : ""}>Ingreso</option>                </select>              </div>              <div class="field">                <label>Categoría</label>                <select id="categoria">                  ${categories[state.type].map(cat => `<option value="${cat}">${cat}</option>`).join("")}                </select>              </div>            </div>            <div class="field">              <label>Método</label>              <select id="metodo">                <option value="efectivo">Efectivo</option>                <option value="debito">Débito</option>                <option value="credito">Crédito</option>                <option value="transferencia">Transferencia</option>              </select>            </div>            <button class="main-btn btn-green" onclick="saveManual()">Guardar movimiento</button>            ${state.dbError ? `<div class="error-box">${state.dbError}</div>` : ""}          </div>          <div class="panel">            <div class="section-title">Movimientos</div>            <div class="filters">              <button class="filter-btn ${state.filter === "todos" ? "active" : ""}" onclick="setFilter('todos')">Todos</button>              <button class="filter-btn ${state.filter === "gasto" ? "active" : ""}" onclick="setFilter('gasto')">Gastos</button>              <button class="filter-btn ${state.filter === "ingreso" ? "active" : ""}" onclick="setFilter('ingreso')">Ingresos</button>            </div>            <div class="list">              ${list.length ? list.map(item => `                <div class="card ${item.tipo}">                  <div class="card-left">                    <div class="card-title">${item.desc}</div>                    <div class="card-meta">                      <span>${item.fecha || ""}</span>                      <span>•</span>                      <span>${item.categoria || ""}</span>                      <span>•</span>                      <span>${item.metodo || ""}</span>                    </div>                  </div>                  <div class="amount ${item.tipo}">                    ${item.tipo === "ingreso" ? "+" : "-"}${formatCLP(item.monto)}                  </div>                </div>              `).join("") : `<div class="empty">Todavía no hay movimientos guardados.</div>`}            </div>          </div>        </div>      `;    }    function setFilter(filter) {      state.filter = filter;      render();    }    function setType(type) {      state.type = type;      render();    }    db.ref("gasto_voz_registros").on(      "value",      snapshot => {        const data = snapshot.val();        state.records = data          ? Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))          : [];        state.dbError = "";        render();      },      err => {        console.error(err);        state.dbError = "No se pudo leer Firebase. Revisa las reglas de Realtime Database.";        render();      }    );    render();  </script></body></html>
