<script type="module">import { SpeechRecognition } from '@capacitor-community/speech-recognition';const btn = document.getElementById("btn-micro");btn.addEventListener("click", async () => {  try {    // pedir permiso    const permission = await SpeechRecognition.requestPermissions();    if (permission.speechRecognition !== 'granted') {      alert("Permiso de micrófono denegado");      return;    }    // iniciar escucha    const result = await SpeechRecognition.start({      language: "es-ES",      maxResults: 1,      prompt: "Habla ahora",      partialResults: false    });    if (result.matches && result.matches.length > 0) {      const texto = result.matches[0];      console.log("Texto:", texto);      alert("Dijiste: " + texto);      // aquí luego conectamos con tus gastos    }  } catch (error) {    console.error(error);    alert("Error con el micrófono");  }});</script>
